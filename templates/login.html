<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TypeFlow | Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

    <div class="background">

        <div class="card">

            <div class="logo">
                ⚡
            </div>

            <h1>TypeFlow</h1>

            <p class="subtitle">
                Improve your typing. One word at a time.
            </p>

            <h2>Welcome Back</h2>

            <form action="/login" method="POST">

    <div class="input-group">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

    </div>

    <div class="input-group">

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

    </div>

    <button type="submit">
        Login
    </button>

</form>

            <p class="register-text">
                Don't have an account?
               <a href="/register">Create Account</a>python
            </p>

        </div>

    </div>

</body>

</html>
